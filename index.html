<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>International Space Station Tracker</title>
    <!-- Link to Orbitron font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&family=Space+Mono&display=swap"
      rel="stylesheet" />
    <!-- Link to globe.gl library -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css" />
    <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
    <!-- Link to styles and scripts -->
    <link rel="stylesheet" href="style.css" />
    <!-- Link to main script but don't execute it until the page is loaded completely -->
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- I created this International Space Station (ISS) Tracker web app to fulfill the
      requirements of an assignment for SHU's MSc Computer Science 'Web Technologies' module -->
    <div class="w3-container">
      <header>
        <!-- Not sure if this is needed -->
      </header>

      <main>
        <h1>International Space Station Tracker</h1>
        <div id="globe"></div>
        <table id="iss-info" >
          <tr>
            <th>Latitude: </th>
            <td id="iss-lat">Loading...</td>
          </tr>
          <tr>
            <th>Longitude: </th>
            <td id="iss-lng">Loading...</td>
          </tr>
          <tr>
            <th>Altitude: </th>
            <td id="iss-alt">Loading...</td>
          </tr>
          <tr>
            <th>Speed: </th>
            <td id="iss-speed">Loading...</td>
          </tr>
          <tr>
            <th>Last updated: </th>
            <td id="iss-time">Loading...</td>
          </tr>
        </table>
      </main>

      <footer>
        <!-- TODO: Put copyright info here? -->
      </footer>
    </div>

  </body>

</html>
