<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>International Space Station Tracker</title>
    <!-- Link to Space Grotesk font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <!-- Link to globe.gl library -->
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css" />
    <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
    <!-- Link to custom styles and scripts -->
    <link rel="stylesheet" href="style.css" />
    <!-- Link to main script. Must identify it as a module because it includes
     an import. js module is automatically deferred.-->
    <script type="module" src="script.js"></script>
  </head>

  <body>
    <!-- I created this International Space Station (ISS) Tracker web app to fulfill the
      requirements of an assignment for SHU's MSc Computer Science 'Web Technologies' module -->
    <div class="w3-container">
      <header>
        <p>Options</p>
      </header>

      <main>
        <h1>International Space Station (ISS) Tracker</h1>
        <div id="globe"></div>
        <div id="iss-info">
        <table title="Current Position of the ISS">
          <tr>
            <th colspan="2">Current Position of ISS</th>  
            </tr>
          <tr>
            <td>Latitude:&nbsp;</td>
            <td class="iss-stat" id="iss-lat">Updating...</td>
          </tr>
          <tr>
            <td>Longitude:&nbsp;</td>
            <td class="iss-stat" id="iss-lng">Updating...</td>
          </tr>
          <tr>
            <td>Altitude:&nbsp;</td>
            <td class="iss-stat" id="iss-alt">Updating...</td>
          </tr>
          <tr>
            <td>Speed:&nbsp;</td>
            <td class="iss-stat" id="iss-speed">Updating...</td>
          </tr>
          <tr>
            <td>Last updated:&nbsp;</td>
            <td class="iss-stat" id="iss-time">Updating...</td>
          </tr>
        </table>
        </div>
      </main>

      <footer>
        <!-- TODO: Put copyright info here? -->
         <p>About this web app</p>
      </footer>
    </div>

  </body>

</html>
